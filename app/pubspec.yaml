name: farrax
description: Smart cattle herd management for Irish & UK farmers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Local Database (Offline-first)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # HTTP Client
  dio: ^5.4.0

  # Secure Storage (for JWT tokens)
  flutter_secure_storage: ^9.0.0

  # EID / Bluetooth
  flutter_blue_plus: ^1.31.0

  # UI & Utilities
  intl: ^0.19.0
  uuid: ^4.3.0
  logger: ^2.2.0
  connectivity_plus: ^6.0.0
  shared_preferences: ^2.2.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Forms & Validation
  reactive_forms: ^17.0.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.18.0
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
